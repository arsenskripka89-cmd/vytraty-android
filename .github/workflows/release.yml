name: Release

# Збирає підписаний APK і публікує реліз на GitHub.
# Запуск: створити тег vX.Y.Z (git tag v1.2.0 && git push origin v1.2.0)
# або вручну: Actions → Release → Run workflow → вказати версію.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версія, напр. 1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/vytraty-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/vytraty-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build and test
        env:
          VYTRATY_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "vytraty-$V.apk"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "vytraty-$V.apk" --clobber
          else
            gh release create "v$V" "vytraty-$V.apk" --title "Витрати $V" --generate-notes
          fi
